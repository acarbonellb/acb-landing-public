name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The live site: the smoke checks hit it and the agent allows its origin.
  # Defaults to the project's *.web.app URL.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.web.app', vars.GCP_PROJECT_ID) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm agent:lint
      - run: pnpm agent:test
      # Replays the committed eval recordings: no model, no network, no key.
      - run: pnpm agent:eval:replay --check
      - run: pnpm agent:build
      - run: pnpm build
        env:
          # The browser tests stub this agent; never deployed from this job.
          NEXT_PUBLIC_AGENT_URL: http://localhost:8080
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    # Only main deploys, and only once the GCP project is configured as
    # repository variables.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for Workload Identity Federation
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Public agent service base URL, inlined into the static export.
          NEXT_PUBLIC_AGENT_URL: ${{ vars.AGENT_URL }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - run: pnpm dlx firebase-tools@15 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

      # Fails the workflow if the live site is down or doesn't serve the real
      # page, or if a redirect host doesn't 301 to it. REDIRECT_HOSTS is
      # space-separated, optional.
      - name: Smoke check
        env:
          REDIRECT_HOSTS: ${{ vars.REDIRECT_HOSTS }}
        # REDIRECT_HOSTS is split into one argument per host on purpose.
        run: scripts/smoke-check.sh "$SITE_URL" $REDIRECT_HOSTS

  deploy-agent:
    # After the site deploy: the smoke check also calls /mcp through the
    # site's Hosting rewrite (firebase.json).
    needs: [test, deploy]
    # Only main deploys, and only once the agent's public URL is configured.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.AGENT_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for Workload Identity Federation
    concurrency:
      group: deploy-agent
      cancel-in-progress: true
    env:
      REGION: europe-southwest1
      IMAGE: europe-southwest1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent/agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" agent && docker push "$IMAGE"

      # The service's public (allUsers) invoker binding is set once by hand
      # and kept across deploys; this job never changes IAM. The model and its
      # prices are the code defaults (agent/src/config.ts). The guardrails'
      # store is `memory` until the AGENT_STORE variable says `firestore`
      # (the database must exist first). The monthly spend cap is set here, in
      # sight, and stays under the Anthropic workspace's own $5/month hard
      # limit (README, Guardrails). `^@^` makes `@` the separator, as
      # ALLOWED_ORIGINS may hold commas.
      - name: Deploy to Cloud Run
        env:
          AGENT_STORE: ${{ vars.AGENT_STORE || 'memory' }}
        run: >-
          gcloud run deploy agent --quiet
          --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --image "$IMAGE"
          --service-account "agent-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest
          --set-env-vars "^@^ALLOWED_ORIGINS=$SITE_URL@AGENT_STORE=$AGENT_STORE@FIRESTORE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@MONTHLY_SPEND_CAP_USD=4"
          --min-instances 0 --max-instances 1 --cpu 1 --memory 512Mi

      # Never calls the model: health, MCP tools (on the agent's URL and on the
      # site's domain), the usage stats, CORS and validation only.
      - name: Smoke check
        run: scripts/agent-smoke-check.sh "${{ vars.AGENT_URL }}" "$SITE_URL"
