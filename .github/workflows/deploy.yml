name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm agent:lint
      - run: pnpm agent:test
      # Replays the committed eval recordings: no model, no network, no key.
      - run: pnpm agent:eval:replay --check
      - run: pnpm agent:build
      - run: pnpm build
        env:
          # The browser tests stub this agent; never deployed from this job.
          NEXT_PUBLIC_AGENT_URL: http://localhost:8080
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    # Only main deploys, and only once the GCP project is configured as
    # repository variables.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for Workload Identity Federation
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Public agent service base URL, inlined into the static export.
          NEXT_PUBLIC_AGENT_URL: ${{ vars.AGENT_URL }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - run: pnpm dlx firebase-tools@15 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive

      # Fails the workflow if the live site is down or doesn't serve the real
      # page. SITE_URL defaults to the project's *.web.app URL.
      - name: Smoke check
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.web.app', vars.GCP_PROJECT_ID) }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$SITE_URL/" -o page.html && grep -q "Alberto Carbonell" page.html; then
              echo "Smoke check passed: $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error::$SITE_URL is down or doesn't contain the expected content"
          exit 1
